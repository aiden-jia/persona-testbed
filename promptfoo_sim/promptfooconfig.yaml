# Persona Prompting Method Comparison — Car Dealership Simulation
#
# Each provider runs the same scenario as a complete two-sided conversation:
#   - Persona side uses the named prompting method (basic / few_shot / etc.)
#   - Salesperson side uses gpt-4o-mini with a dealership sales system prompt
# The conversation runs until: walkout detected | deal accepted | max 30 turns each
#
# Setup:
#   1. npm install -g promptfoo
#   2. Activate your Python venv (same one used by may_term/)
#   3. Export OPENAI_API_KEY (or it will be loaded from may_term/.env by the provider)
#   4. From this directory: promptfoo eval
#   5. View results: promptfoo view   OR   open results/latest_eval.json

description: "Persona Prompting Method Comparison — Car Dealership Simulation"

# Limit parallel test cases to avoid OpenAI rate limit errors.
# 10 total cases (5 methods × 2 scenarios) each make many API calls per turn.
evaluateOptions:
  maxConcurrency: 2

# gpt-4o for grading — stronger reasoning than gpt-4o-mini, better at nuanced evaluation
defaultTest:
  options:
    provider: openai:chat:gpt-4o

providers:
  - id: "python:provider.py"
    label: "basic"
    config:
      method: "basic"
      max_turns_each: 30

  - id: "python:provider.py"
    label: "few_shot"
    config:
      method: "few_shot"
      max_turns_each: 30

  - id: "python:provider.py"
    label: "chain_of_thought"
    config:
      method: "chain_of_thought"
      max_turns_each: 30

  - id: "python:provider.py"
    label: "tree_of_thought"
    config:
      method: "tree_of_thought"
      max_turns_each: 30

  - id: "python:provider.py"
    label: "reflection"
    config:
      method: "reflection"
      max_turns_each: 30

# The prompt is just a label — the real inputs come from vars via provider config
prompts:
  - "persona={{persona_name}} | scenario={{scenario_id}}"

tests:
  - description: "Car Buyer — Honda CR-V Negotiation"
    vars:
      persona_name: "Car Buyer"
      scenario_id: "standard_negotiation"
      agent_name: "Car Buyer"
      trainee_name: "Salesperson"
      conversation_context: "Standard car dealership negotiation for a Honda CR-V"
    assert:
      - type: llm-rubric
        threshold: 0.7
        value: |
          You are an expert evaluator of AI persona behavior in business training roleplays.

          A platform allows businesses to train employees through AI-powered roleplay simulations (e.g., sales calls, customer service). In each session, a human trainee interacts with an AI-generated persona ("AI persona"). Your task is to evaluate the AI persona's behavior quality — NOT the trainee's.

          Speaker identification:
          - The AI persona's display name is: {{agent_name}}
          - The trainee's display name is: {{trainee_name}}
          Note: in the transcript, the AI persona's turns are labeled `PERSONA (method)` and the trainee's turns are labeled `SALESPERSON`. Use these labels as the authoritative source of who is speaking.

          General guidelines:
          - Evaluate ONLY the AI persona's behavior, NOT the trainee's.
          - A session may begin with an introductory announcement from the system — ignore it.
          - Ground every judgment in concrete evidence. Reference specific turn indices.

          ## Criterion: Small Talk
          This criterion measures whether the AI persona engages in natural, appropriate small talk when the conversation calls for it.

          What to look for:
          - When the trainee initiates pleasantries (e.g., "How are you?", "Good morning"), does the AI persona reciprocate naturally?
          - After small talk, does the AI persona transition smoothly back to the main topic, or does it get stuck in an irrelevant loop?
          - Is the tone of the small talk human-like and conversational rather than robotic or overly formal?

          Edge case: If the scenario does not create any natural opportunity for small talk (e.g., an urgent complaint call where the AI persona is angry from the start), and neither party initiates it, do NOT penalize — score=1.

          How to score:
          1–2: Completely ignores small talk or responds so robotically that it actively disrupts the conversation
          3–4: Responds to pleasantries but in a clearly unnatural or stilted way; may get stuck or derail
          5–6: Handles small talk adequately but with noticeable awkwardness or abrupt transitions
          7–8: Handles small talk naturally with smooth transitions back to the main topic; minor issues only
          9–10: Small talk is seamless and human-like, or small talk is not applicable to the scenario

          Failure types (mention in reasoning if score=0):
          - "ignores-pleasantries": The persona ignores or dismisses the trainee's small talk overtures.
          - "robotic-response": The persona responds to small talk in an unnatural or overly formal way.
          - "derailed-by-small-talk": Small talk derails the conversation from its main purpose.

          Output format — return ONLY valid JSON:
          {
            "score": <1-10>,
            "reasoning": "<explanation>"
          }

          Reasoning requirements:
          - For scores 1–6: cite each failing turn using [T<n>] format (e.g., "[T2] persona ignores the trainee's greeting and jumps straight to business"). Mention the applicable failure type from the list above.
          - For scores 7–10: optionally cite the turn that best illustrates passing behavior using [T<n>] format.
          - Keep to 2-3 sentences total.

          Scores 7–10 mean the criterion PASSED; scores 1–6 mean FAILED.
          Produce ONLY the JSON object. No preamble, no markdown fences, no commentary.

