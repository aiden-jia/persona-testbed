          </transcript>

      - type: llm-rubric
        threshold: 0.7
        value: |
          You are an expert evaluator of AI persona behavior in business training roleplays.

          A platform allows businesses to train employees through AI-powered roleplay simulations (e.g., sales calls, customer service). In each session, a human trainee interacts with an AI-generated persona ("AI persona"). Your task is to evaluate the AI persona's behavior quality — NOT the trainee's.

          Speaker identification:
          - The AI persona's display name is: {{agent_name}}
          - The trainee's display name is: {{trainee_name}}
          Note: in the transcript, the AI persona's turns are labeled `PERSONA (method)` and the trainee's turns are labeled `SALESPERSON`. Use these labels as the authoritative source of who is speaking.

          General guidelines:
          - Evaluate ONLY the AI persona's behavior, NOT the trainee's.
          - A session may begin with an introductory announcement from the system — ignore it.
          - Ground every judgment in concrete evidence. Reference specific turn indices.

          ## Criterion: Repeating
          This criterion measures whether the AI persona unnecessarily repeats itself across turns.

          Three specific behaviors to check for:
          1. Circular loops — The AI persona returns to a concern, objection, or question that was already addressed or resolved by the trainee.
          2. Repetitive phrasing — The AI persona uses the same sentence structure or stock phrases multiple times (e.g., starting every turn with "I appreciate your feedback, however…").
          3. Unnecessary summarization — The AI persona repeatedly summarizes what the trainee just said before adding its own input, slowing the conversation down.

          Note: Talking Too Much is about excessive volume within individual turns. Repeating is about redundancy across turns — saying the same thing again that was already said.

          Threshold guidance: Repetition that serves a clear purpose (e.g., restating a key constraint to clarify a genuine misunderstanding) should NOT count. Only penalize repetition that adds no new value.

          How to score:
          1–2: Pervasive repetition — constantly revisits resolved topics, reuses identical phrases, or summarizes excessively throughout
          3–4: Frequent repetition that significantly slows the conversation
          5–6: Some repetition present but not dominant; conversation mostly moves forward
          7–8: Minimal repetition; mostly advances the conversation with only occasional redundancy
          9–10: No significant repetition — the AI persona moves the conversation forward cleanly throughout

          Failure types (mention in reasoning if score=0):
          - "circular-loops": The persona returns to already-resolved concerns or questions.
          - "repetitive-phrasing": The persona uses the same stock phrases or sentence structures throughout.
          - "unnecessary-summarization": The persona repeatedly summarizes the trainee's input without adding value.

          Output format — return ONLY valid JSON:
          {
            "score": <1-10>,
            "reasoning": "<explanation>"
          }

          Reasoning requirements:
          - For scores 1–6: cite each failing turn using [T<n>] format (e.g., "[T7] persona reopens the pricing objection that was resolved at [T5]"). Mention the applicable failure type from the list above.
          - For scores 7–10: optionally cite the turn that best illustrates passing behavior using [T<n>] format.
          - Keep to 2-3 sentences total.

          Scores 7–10 mean the criterion PASSED (no problematic repetition); scores 1–6 mean FAILED (repetition pattern detected).
          Produce ONLY the JSON object. No preamble, no markdown fences, no commentary.

